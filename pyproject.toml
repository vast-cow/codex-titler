[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[project]
name = "codex-auto-title"
version = "0.1.0"
description = "Conservative automatic titles for an existing Codex App Server"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.3", "websockets==16.1.1", "tiktoken==0.14.0"]

[project.scripts]
codex-auto-title = "codex_auto_title.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auto_title"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
