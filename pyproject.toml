[project]
name = "codex-titler"
version = "0.1.0"
description = "Repair long Codex thread names through app-server"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "regex>=2024.11", "tenacity>=9,<10", "aiosqlite>=0.20,<1", "structlog>=25,<26"]
[project.scripts]
codex-titler = "codex_titler.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
